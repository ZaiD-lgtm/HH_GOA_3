[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hhg3"
version = "0.1.0"
description = "Face scan -> web/social search -> blockchain verification pipeline (HH Goa 2026, Task 3)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
face = ["onnxruntime>=1.17"]           # ArcFace R50, 512-d
insightface = ["insightface>=0.7.3", "onnxruntime>=1.17"]
evm = ["web3>=6.15", "py-solc-x>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
hhg3 = "hhg3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
